- id: REF-001
  name: "Ken Research Button: shimmer"
  url: https://kenresearch.com/
  sourceKind: internal
  category: CTA
  interaction: Solid CTA with a left-to-right light sweep (700 ms) on hover; original look is yellow, pill, dark label.
  visual: solid accent fill, pill, light band sweep
