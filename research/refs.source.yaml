- id: REF-003
  name: "Magic UI: interactive hover button"
  url: https://magicui.design/docs/components/interactive-hover-button
  sourceKind: library
  category: CTA
  interaction: A small dot grows to fill the button on hover while the label swaps out and a second label with arrow swaps
    in (300 ms).
  visual: outline pill with dot, label swap
  states:
    - default
    - hover
    - focus-visible
  responsive: Hover is decorative; on coarse pointers the :active state carries the feedback.
  feasibility: Dot is a child that scales inside a host with overflow clip, so any radius clips it correctly; label swap
    uses a duplicated aria-hidden label.
  customizable:
    - color
    - radius
    - icon
    - size
  coupling: C
  radiusSupport: any
  a11y: Duplicated label must be aria-hidden; reduced motion shows only the end-state label.
  perf:
    animated:
      - scale
      - opacity
    js: false
  license:
