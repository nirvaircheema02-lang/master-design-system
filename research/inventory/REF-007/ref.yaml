id: REF-007
name: "Stripe: fill + arrow nudge"
url: https://stripe.com/
sourceKind: production-site
captured: 2026-11-06
category: CTA
interaction: Fill fades (300 ms) while the arrow glyph inside the button nudges forward (transform 300 ms).
visual: solid fill, trailing chevron
states:
  - default
  - hover
  - focus-visible
responsive: Hover is decorative; on coarse pointers the :active state carries the feedback.
feasibility: Arrow lives in an icon slot and the nudge is a translate of the glyph; any clip is on the inner
  icon box, not the button edge, so the outer radius is unaffected.
customizable:
  - color
  - radius
  - icon
coupling: C
radiusSupport: any
a11y: Glyph is decorative (aria-hidden).
perf:
  animated:
    - background-color
    - transform
  js: false
license:
