id: REF-028
name: "Material 3 Button: shape morph"
url: https://m3.material.io/components/buttons/overview
sourceKind: design-system
captured: 2026-11-06
category: CTA
interaction: Corner shape morphs on press and when a toggle is selected; five colour styles, five sizes.
visual: round/square shapes
states:
  - enabled
  - hover
  - focus
