id: REF-084
name: "shadcn Input: ring on focus"
url: https://ui.shadcn.com/docs/components/input
sourceKind: design-system
captured: 2026-11-06
category: INP
interaction: 32 px field, 10 px radius; border colour and ring change over 150 ms on focus. The docs demos use
  placeholder-only fields.
visual: bordered field
states:
  - default
  - focus
  - disabled
  - invalid
responsive: Hover is decorative; on coarse pointers the :active state carries the feedback.
feasibility: Ring + border transition; demo omits visible labels.
customizable:
  - colour
  - radius
coupling: A
radiusSupport: any
a11y: Placeholder-only demos teach the anti-pattern (WCAG 3.3.2).
perf:
  animated:
    - border-color
    - box-shadow
  js: false
license:
  status: unverified
  usage: inspiration-only
  note: Licence not verified from a primary source (register.md).
