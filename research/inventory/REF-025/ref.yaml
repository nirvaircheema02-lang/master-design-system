id: REF-025
name: shadcn/ui Button
url: https://ui.shadcn.com/docs/components/button
sourceKind: design-system
captured: 2026-11-06
category: CTA
interaction: Button exposes variant and size as props, supports an inline icon via data-icon, and transitions
  colours over 150 ms.
visual: six variants, sizes
states:
  - default
  - hover
  - focus-visible
  - disabled
responsive: Hover is decorative; on coarse pointers the :active state carries the feedback.
feasibility: Props API is a fixed set; styling is CSS variables via Tailwind.
customizable:
  - variant
  - size
  - icon
coupling: A
radiusSupport: any
a11y: No accessibility section on the page (read 2026-11-05).
perf:
  animated:
    - background-color
    - color
  js: false
license:
  status: unverified
  usage: inspiration-only
  note: Licence not verified from a primary source (register.md).
measured:
