id: REF-063
name: GitHub mobile navigation drawer
url: https://github.com/
sourceKind: production-site
captured: 2026-11-06
category: NAV
interaction: At 390 px the "Toggle navigation" button opens a full-height menu over a backdrop; page scroll
  locks, Escape closes it and focus returns to the button.
visual: full-height mobile menu
states:
  - closed
  - open
responsive: Hover is decorative; on coarse pointers the :active state carries the feedback.
feasibility: "Modal-style drawer without a dialog role; behaviours verified by probe. Radius is unaffected:
  the drawer is a full-height edge-anchored panel, so corner radius only applies to inner elements."
customizable:
  - colour
  - width
coupling: C
radiusSupport: any
a11y: Escape and focus return verified; a modal drawer should follow the APG modal dialog (name, trap).
