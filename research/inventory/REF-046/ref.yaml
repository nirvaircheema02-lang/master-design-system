id: REF-046
name: "shadcn/ui Tabs: segmented pill"
url: https://ui.shadcn.com/docs/components/tabs
sourceKind: design-system
captured: 2026-11-06
category: TAB
interaction: "Segmented-control style tabs: the selected tab gets a filled pill with a shadow, background and
  shadow fade over 150 ms; manual activation."
visual: pill segmented control
states:
  - default
  - hover
  - selected
  - focus-visible
responsive: Hover is decorative; on coarse pointers the :active state carries the feedback.
feasibility: Fill pill behind the label; animates box-shadow (paint), which our rules forbid.
customizable:
  - colour
  - radius
coupling: A
radiusSupport: any
a11y: Selected pill is not the only cue if text weight also changes.
